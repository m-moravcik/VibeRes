name: VibeRes
options:
  bundleIdPrefix: sk.moravcik
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.10.1"
    CURRENT_PROJECT_VERSION: "24"
    # Signing identity and team are intentionally NOT pinned here. Day-to-day
    # builds and CI sign ad-hoc (CODE_SIGN_IDENTITY="-"), which keeps the repo
    # buildable by anyone without an Apple Developer account. The notarized
    # release overrides these from the command line — see
    # scripts/release-signed.sh.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Required for notarization. Applies to ad-hoc builds too — `codesign
    # --sign - --options runtime` yields flags=0x10002(adhoc,runtime) — so the
    # hardened runtime, and with it library validation, is active in every
    # configuration. That matters the moment a pre-signed third-party framework
    # is embedded: library validation will refuse to load it under an ad-hoc
    # signature, breaking local and CI builds rather than only releases.
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      # Sparkle.framework and its nested helpers ship ad-hoc signed. The
      # hardened runtime is NOT inert under an ad-hoc signature — verified:
      # `codesign --sign - --options runtime` yields flags=0x10002(adhoc,runtime)
      # — and it enables library validation, which then refuses to load the
      # framework. Without this, adding the dependency breaks every local and CI
      # build, not just releases. Release keeps the hardened runtime, which
      # notarization requires.
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      # The scheme sets gatherCoverageData for the test action, but xcodebuild
      # applies it as a build setting to the `build` action too. That pulls in
      # -profile-generate, and the coverage runtime drags
      # com.apple.security.get-task-allow into the entitlements — which Apple
      # rejects at notarization, because it lets a debugger attach to a signed
      # app. It also shipped a slower, instrumented binary in every release up
      # to 0.8.1. Coverage belongs to `xcodebuild test` (Debug) only.
      ENABLE_CODE_COVERAGE: NO
      # Belt and braces: never let Xcode inject debug entitlements into a
      # build that is meant for distribution.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      # Gates the Sparkle call sites. The framework is embedded in every
      # configuration — XcodeGen has no per-configuration dependency filter —
      # but only Release compiles the updater that drives it.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ENABLE_SPARKLE"

schemes:
  VibeRes:
    build:
      targets:
        VibeRes: all
        VibeResTests: [test]
        # Built alongside so the CLI integration tests can find the binary
        # next to the test bundle instead of guessing at a derived-data path.
        viberes-cli: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - VibeRes
      targets:
        - VibeResTests

  # Separate scheme on purpose. These drive the real app through the
  # accessibility API — the only way to assert that a resolution row is a
  # button and not a tap gesture — and they need a windowserver session. A
  # flaky runner must not be able to take the unit tests down with it.
  VibeResUI:
    build:
      targets:
        VibeRes: all
        VibeResUITests: [test]
    test:
      targets:
        - VibeResUITests

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Pinned exactly, and the pin is the thing that has to be watched: an
    # updater is the one dependency whose compromise is arbitrary code
    # execution. 2.9.4 was covered by three advisories — GHSA-3x7w-j75x-ppq5
    # and GHSA-4v99-qgq9-6pxp (both high, symlink races in the privileged
    # installer, <= 2.9.5) and GHSA-gmj2-gq3j-vqmj (<= 2.9.4). 2.10.0 is
    # outside all three ranges. `.github/workflows/dependency-audit.yml`
    # re-checks this pin against the advisory API weekly so the next one is
    # not found by hand.
    exactVersion: 2.10.0

targets:
  VibeRes:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: VibeRes
    info:
      path: VibeRes/Info.plist
      properties:
        CFBundleDisplayName: VibeRes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Michal Moravčík. MIT License."
        # Tell macOS which UI languages the bundle ships. The String Catalog
        # at VibeRes/Resources/Localizable.xcstrings provides en/sk/de copy;
        # without this list, the system will only ever pick the development
        # language and translated catalog entries are silently ignored.
        CFBundleLocalizations:
          - en
          - sk
          - de
        CFBundleAllowMixedLocalizations: true
        # Live preview captures the desktop through ScreenCaptureKit
        # (DesktopCapture.swift), so the declaration is required, not optional:
        # Apple's guidance is to ship it with an app-authored reason before any
        # capture. The comment that used to sit here said the feature was not
        # implemented — it has been since the live preview shipped.
        NSScreenCaptureUsageDescription: >-
          VibeRes shows a live thumbnail of your desktop when you hover a
          resolution, so you can see how it will look before applying it.
          Nothing is recorded, stored or sent anywhere.
        #
        # Sparkle. The feed lives on a stable path in the repo rather than as a
        # release asset: `releases/latest/download/appcast.xml` 404s for every
        # client, permanently, the moment one release is published without that
        # asset attached.
        SUFeedURL: https://raw.githubusercontent.com/m-moravcik/VibeRes/main/appcast.xml
        SUPublicEDKey: ciayVzrfVUd/AHaU8EB8T7xsMfathzO3rKMGxHK1xEk=
        SUEnableAutomaticChecks: true
        # Load-bearing. Auto-download is off by default, and the delegate hook
        # that raises the "update ready" row only fires after an *automatic*
        # download — without this the row never appears and nothing logs why.
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
        # Refuse a feed that is not signed with our EdDSA key. Without it,
        # someone able to substitute the feed cannot ship a malicious build (the
        # enclosure signature stops that) but can pin users to an older,
        # validly signed release.
        SURequireSignedFeed: true
        # Sparkle *requires* this alongside SURequireSignedFeed and refuses to
        # start without it (SPUUpdater.m: "For security reasons,
        # SUVerifyUpdateBeforeExtraction needs to also be enabled if
        # SURequireSignedFeed is enabled"). 0.8.3 shipped with only the former,
        # so its updater died at launch with nothing in the logs.
        SUVerifyUpdateBeforeExtraction: true
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.moravcik.VibeRes
        PRODUCT_NAME: VibeRes
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Debug:
          # A Debug build is a different app to macOS. Under the shipped
          # identifier it shared the installed copy's preferences, login item
          # and permission grants, and XCUITest's "activate by bundle id" could
          # bring the installed copy forward mid-test: the popover under test
          # lost key status and closed, which is why the UI tests flapped on
          # any Mac that also runs VibeRes.
          PRODUCT_BUNDLE_IDENTIFIER: sk.moravcik.VibeRes.debug

  VibeResTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: VibeResTests
    dependencies:
      - target: VibeRes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.moravcik.VibeResTests
        GENERATE_INFOPLIST_FILE: YES
        # Same checking as the app. These tests drive the app's own actors, so
        # a weaker setting here means a concurrency defect is caught in one
        # target and waved through in the target that exercises it.
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - VibeResTests
      gatherCoverageData: true

  VibeResUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: VibeResUITests
    dependencies:
      - target: VibeRes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.moravcik.VibeResUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VibeRes
        SWIFT_STRICT_CONCURRENCY: complete

  viberes-cli:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    productName: viberes
    sources:
      # Reuse the Core layer instead of duplicating the logic.
      - path: VibeRes/Core
      - path: VibeResCLI
    settings:
      base:
        PRODUCT_NAME: viberes
        # The executable is `viberes`; the *module* is not. Both products land
        # in the same directory, and on a case-insensitive filesystem a
        # `viberes.swiftmodule` next to `VibeRes.swiftmodule` makes the test
        # target's `@testable import VibeRes` resolve to the CLI.
        PRODUCT_MODULE_NAME: VibeResCLI
        # The CLI compiles the *same* VibeRes/Core sources as the app. Checking
        # them strictly in one target and loosely in the other meant a data
        # race in Core could pass CI through the side that was not looking.
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
