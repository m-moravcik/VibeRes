name: VibeRes
options:
  bundleIdPrefix: sk.moravcik
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.8.5"
    CURRENT_PROJECT_VERSION: "20"
    # Signing identity and team are intentionally NOT pinned here. Day-to-day
    # builds and CI sign ad-hoc (CODE_SIGN_IDENTITY="-"), which keeps the repo
    # buildable by anyone without an Apple Developer account. The notarized
    # release overrides these from the command line — see
    # scripts/release-signed.sh.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Required for notarization. Applies to ad-hoc builds too — `codesign
    # --sign - --options runtime` yields flags=0x10002(adhoc,runtime) — so the
    # hardened runtime, and with it library validation, is active in every
    # configuration. That matters the moment a pre-signed third-party framework
    # is embedded: library validation will refuse to load it under an ad-hoc
    # signature, breaking local and CI builds rather than only releases.
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      # Sparkle.framework and its nested helpers ship ad-hoc signed. The
      # hardened runtime is NOT inert under an ad-hoc signature — verified:
      # `codesign --sign - --options runtime` yields flags=0x10002(adhoc,runtime)
      # — and it enables library validation, which then refuses to load the
      # framework. Without this, adding the dependency breaks every local and CI
      # build, not just releases. Release keeps the hardened runtime, which
      # notarization requires.
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      # The scheme sets gatherCoverageData for the test action, but xcodebuild
      # applies it as a build setting to the `build` action too. That pulls in
      # -profile-generate, and the coverage runtime drags
      # com.apple.security.get-task-allow into the entitlements — which Apple
      # rejects at notarization, because it lets a debugger attach to a signed
      # app. It also shipped a slower, instrumented binary in every release up
      # to 0.8.1. Coverage belongs to `xcodebuild test` (Debug) only.
      ENABLE_CODE_COVERAGE: NO
      # Belt and braces: never let Xcode inject debug entitlements into a
      # build that is meant for distribution.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      # Gates the Sparkle call sites. The framework is embedded in every
      # configuration — XcodeGen has no per-configuration dependency filter —
      # but only Release compiles the updater that drives it.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ENABLE_SPARKLE"

schemes:
  VibeRes:
    build:
      targets:
        VibeRes: all
        VibeResTests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - VibeRes
      targets:
        - VibeResTests

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4

targets:
  VibeRes:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: VibeRes
    info:
      path: VibeRes/Info.plist
      properties:
        CFBundleDisplayName: VibeRes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Michal Moravčík. MIT License."
        # Tell macOS which UI languages the bundle ships. The String Catalog
        # at VibeRes/Resources/Localizable.xcstrings provides en/sk/de copy;
        # without this list, the system will only ever pick the development
        # language and translated catalog entries are silently ignored.
        CFBundleLocalizations:
          - en
          - sk
          - de
        CFBundleAllowMixedLocalizations: true
        # Re-add NSScreenCaptureUsageDescription only when (and if) the live
        # screenshot preview is actually implemented. Until then, declaring an
        # unused permission is misleading and would trip privacy reviewers.
        #
        # Sparkle. The feed lives on a stable path in the repo rather than as a
        # release asset: `releases/latest/download/appcast.xml` 404s for every
        # client, permanently, the moment one release is published without that
        # asset attached.
        SUFeedURL: https://raw.githubusercontent.com/m-moravcik/VibeRes/main/appcast.xml
        SUPublicEDKey: ciayVzrfVUd/AHaU8EB8T7xsMfathzO3rKMGxHK1xEk=
        SUEnableAutomaticChecks: true
        # Load-bearing. Auto-download is off by default, and the delegate hook
        # that raises the "update ready" row only fires after an *automatic*
        # download — without this the row never appears and nothing logs why.
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
        # Refuse a feed that is not signed with our EdDSA key. Without it,
        # someone able to substitute the feed cannot ship a malicious build (the
        # enclosure signature stops that) but can pin users to an older,
        # validly signed release.
        SURequireSignedFeed: true
        # Sparkle *requires* this alongside SURequireSignedFeed and refuses to
        # start without it (SPUUpdater.m: "For security reasons,
        # SUVerifyUpdateBeforeExtraction needs to also be enabled if
        # SURequireSignedFeed is enabled"). 0.8.3 shipped with only the former,
        # so its updater died at launch with nothing in the logs.
        SUVerifyUpdateBeforeExtraction: true
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.moravcik.VibeRes
        PRODUCT_NAME: VibeRes
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  VibeResTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: VibeResTests
    dependencies:
      - target: VibeRes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.moravcik.VibeResTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
    scheme:
      testTargets:
        - VibeResTests
      gatherCoverageData: true

  viberes-cli:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    productName: viberes
    sources:
      # Reuse the Core layer instead of duplicating the logic.
      - path: VibeRes/Core
      - path: VibeResCLI
    settings:
      base:
        PRODUCT_NAME: viberes
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
