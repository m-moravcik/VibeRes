name: Release

# Triggers when you push a tag like v0.4.0. End-to-end:
#   1. Verify the tag matches MARKETING_VERSION in project.yml
#   2. Run the test suite (any failure cancels the release)
#   3. Import the Developer ID certificate into a throwaway keychain
#   4. Build, sign, notarize and staple VibeRes.app, then package it as
#      VibeRes-X.Y.Z.zip (scripts/release-signed.sh does all of this)
#   5. Extract the matching CHANGELOG section as release notes
#   6. Create the GitHub Release with the ZIP attached
#   7. Sync Formula/viberes.rb and Casks/viberes-app.rb to the tap repo
#
# Required repo secrets — see .github/RELEASING.md for how to produce each one:
#   MACOS_CERT_P12_BASE64  — base64 of the exported "Developer ID Application"
#                            identity (certificate + private key) as .p12
#   MACOS_CERT_PASSWORD    — password set when exporting that .p12
#   KEYCHAIN_PASSWORD      — any random string; secures the temporary keychain
#   AC_API_KEY_P8_BASE64   — base64 of the App Store Connect API key (.p8)
#   AC_API_KEY_ID          — that key's ID
#   AC_API_ISSUER_ID       — the issuer UUID from App Store Connect
#   TAP_PUSH_TOKEN         — fine-grained PAT with contents:write scope on
#                            m-moravcik/homebrew-viberes. Without it, the
#                            tap-sync step fails — the release still publishes.
#
# The Team ID is derived from the certificate's common name, so there is no
# secret for it. Override with the DEVELOPMENT_TEAM env var if that ever fails.

on:
  push:
    tags:
      - "v*.*.*"
  # Manual trigger lets you re-run a release if something flaked, by passing
  # the existing tag. Make sure the tag already exists on origin first.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.4.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # One global group, not per-ref. A tag push resolves github.ref to
  # refs/tags/vX.Y.Z and a manual dispatch to refs/heads/main, so a per-ref
  # group let both run at once — which is how v0.8.4 and v0.8.5 ended up with an
  # appcast signed for one run's build and an asset uploaded by another's.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, package, publish
    runs-on: macos-26
    # Notarization dominates the runtime and Apple's notary queue has no SLA —
    # an hour of "In Progress" is not unusual. Keep this comfortably above the
    # script's NOTARY_TIMEOUT (90m) plus build and test time.
    timeout-minutes: 150

    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Resolve tag (push vs workflow_dispatch)
        id: tag
        env:
          # Through the environment, never into the script body: `${{ }}` is
          # substituted before bash sees the line, so a crafted tag would be
          # shell code rather than data.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::refusing to release from a tag that is not vMAJOR.MINOR.PATCH: $TAG"
            exit 1
          fi
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout at tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.ref }}

      - name: Resolve version from tag
        id: version
        run: |
          # Strip the leading "v" from the tag so version is "0.4.0", not "v0.4.0".
          TAG="${{ steps.tag.outputs.ref }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (tag $TAG)"

      - name: Verify tag matches project.yml version
        run: |
          PROJECT_VERSION=$(awk -F'"' '/MARKETING_VERSION:/ {print $2}' project.yml)
          if [ "$PROJECT_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::project.yml says $PROJECT_VERSION but tag says ${{ steps.version.outputs.version }}"
            exit 1
          fi
          echo "Version match: $PROJECT_VERSION"

      - name: Verify the build number increased
        run: |
          # Sparkle compares sparkle:version, which is CFBundleVersion. A
          # forgotten bump makes every client see "no update" with nothing
          # logged anywhere, so it is checked here rather than discovered later.
          CURRENT=$(awk -F'"' '/CURRENT_PROJECT_VERSION:/ {print $2; exit}' project.yml)
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -v "^${{ steps.version.outputs.tag }}$" | head -1)
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "no previous tag; skipping monotonicity check"
            exit 0
          fi
          PREVIOUS=$(git show "$PREVIOUS_TAG:project.yml" | awk -F'"' '/CURRENT_PROJECT_VERSION:/ {print $2; exit}')
          echo "CURRENT_PROJECT_VERSION: $PREVIOUS ($PREVIOUS_TAG) -> $CURRENT"
          if [ "$CURRENT" -le "$PREVIOUS" ]; then
            echo "::error::CURRENT_PROJECT_VERSION must increase: $PREVIOUS -> $CURRENT"
            exit 1
          fi

      - name: Verify the tag is on main
        env:
          TAG: ${{ steps.tag.outputs.ref }}
        run: |
          # Signing certificate, notarization key and the Sparkle private key are
          # all reachable from this job, so the code being built has to be code
          # that went through main — not whatever an arbitrary tag points at.
          # The checkout above already ran with fetch-depth: 0, so this only
          # needs to update the origin/main ref (git rejects --depth=0).
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "::error::$TAG is not an ancestor of origin/main; refusing to release with signing secrets."
            exit 1
          fi
          echo "$TAG is on main"

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: |
          xcodebuild test \
            -project VibeRes.xcodeproj \
            -scheme VibeRes \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions

      # Signing happens in a keychain created for this run only. Importing into
      # login.keychain would leave the private key on the runner image cache
      # path and, more importantly, is not unlockable headlessly.
      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          for var in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::secret $var is not set — cannot produce a notarized build."
              exit 1
            fi
          done

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERT="$RUNNER_TEMP/cert.p12"

          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT"
          [ -s "$CERT" ] || { echo "::error::decoded .p12 is empty — check the base64 secret."; exit 1; }

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          # Without an explicit partition list, codesign triggers an interactive
          # keychain prompt that can never be answered on a headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Put our keychain first in the user search list so xcodebuild finds it.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT"

          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo "::error::no Developer ID Application identity in the imported keychain."
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "Certificate imported."

      - name: Build, sign, notarize, staple and package
        id: package
        env:
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          for var in AC_API_KEY_P8_BASE64 AC_API_KEY_ID AC_API_ISSUER_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::secret $var is not set — cannot notarize."
              exit 1
            fi
          done

          AC_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$AC_API_KEY_P8_BASE64" | base64 --decode > "$AC_API_KEY_PATH"
          [ -s "$AC_API_KEY_PATH" ] || { echo "::error::decoded .p8 is empty."; exit 1; }
          chmod 600 "$AC_API_KEY_PATH"
          export AC_API_KEY_PATH

          # The script writes zip / sha256 / version to $GITHUB_OUTPUT itself.
          ./scripts/release-signed.sh

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Pull the section between "## [VERSION]" and the next "## [" header.
          # If the section isn't found, fall back to a generic notes string.
          awk -v ver="## [$VERSION]" '
            index($0, ver) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ] || ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::warning::No '## [$VERSION]' section in CHANGELOG.md — using generic notes."
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for full notes.\n' \
              "$GITHUB_REPOSITORY" > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          # Idempotent: a re-run, or a second run racing the first, must attach
          # the archive to the existing release rather than abort — by this
          # point the build has already been notarized.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "release v${VERSION} exists; uploading the archive to it"
            gh release upload "v${VERSION}" "$ZIP" --clobber
          else
            gh release create "v${VERSION}" \
              "$ZIP" \
              --title "VibeRes ${VERSION}" \
              --notes-file release-notes.md
          fi

      # These run *after* the release exists. Publishing the appcast earlier
      # can advertise an enclosure signature for bytes nobody can download —
      # which is what three racing runs produced for 0.8.5.
      - name: Generate and sign the appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$SPARKLE_EDDSA_PRIVATE_KEY" ]; then
            echo "::error::secret SPARKLE_EDDSA_PRIVATE_KEY is not set — clients would get an unsigned feed."
            exit 1
          fi
          KEY="$RUNNER_TEMP/sparkle_ed25519.key"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"
          # From the *published* asset, not the local build. Two runs building
          # the same version produce different bytes, and publishing a feed
          # signed for the local copy is how v0.8.4 and v0.8.5 ended up
          # advertising a signature for an archive nobody could download.
          PUBLISHED="$RUNNER_TEMP/published"
          rm -rf "$PUBLISHED" && mkdir -p "$PUBLISHED"
          gh release download "v${VERSION}" --pattern '*.zip' --dir "$PUBLISHED"
          ASSET="$PUBLISHED/VibeRes-${VERSION}.zip"
          [ -f "$ASSET" ] || { echo "::error::published asset missing"; exit 1; }

          SPARKLE_EDDSA_PRIVATE_KEY_PATH="$KEY" DERIVED_DATA=./build \
            ./scripts/make-appcast.sh "$ASSET" appcast.xml

          # Prove the pairing before it is published, not after a user hits it.
          # --ed-key-file is required even for --verify: without it sign_update
          # looks for the key in the runner's keychain, where it never is.
          SIGN_UPDATE="$(find ./build/SourcePackages/artifacts -name sign_update -type f -perm +111 | head -1)"
          SIG="$(python3 -c "import re,sys; print(re.search(r'sparkle:edSignature=\"([^\"]+)\"', open('appcast.xml').read()).group(1))")"
          "$SIGN_UPDATE" --ed-key-file "$KEY" --verify "$ASSET" "$SIG" \
            || { echo "::error::appcast signature does not verify against the published asset"; exit 1; }
          echo "feed verified against the published asset"
          rm -f "$KEY"

      - name: Commit the appcast to main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The feed lives on a stable path rather than as a release asset: a
          # release published without the asset would 404 every client's update
          # check permanently.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp appcast.xml "$RUNNER_TEMP/appcast.xml"

          # Retry on a losing race. Notarization has already cost the better part
          # of an hour by this point, so a push that lands while we were waiting
          # must not throw the release away — which is exactly what happened to
          # the first 0.8.4 attempt.
          # `set -e` is on (shell: bash -e), so every step that is allowed to
          # fail has to say so explicitly. The previous version of this loop did
          # not, and died on the first iteration instead of retrying.
          set +e
          for attempt in 1 2 3 4 5; do
            git fetch origin main || { sleep 5; continue; }

            # -f because the generating step left appcast.xml modified in the
            # working tree and plain checkout refuses to overwrite it. The
            # generated file is safe in RUNNER_TEMP.
            git checkout -f -B appcast-update origin/main || { sleep 5; continue; }

            cp "$RUNNER_TEMP/appcast.xml" appcast.xml
            git add appcast.xml
            if git diff --staged --quiet; then
              echo "appcast unchanged"
              exit 0
            fi
            git commit -m "Publish appcast for ${VERSION}" || { sleep 5; continue; }

            if git push origin appcast-update:main; then
              echo "appcast published on attempt $attempt"
              exit 0
            fi
            echo "push rejected — main moved; retrying ($attempt/5)"
            sleep $((attempt * 5))
          done
          echo "::error::could not publish the appcast after 5 attempts"
          exit 1

      - name: Smoke-check the published feed
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          # Fetch the feed and the asset the way a user's copy of VibeRes will,
          # and verify the pairing. Everything before this point tested our own
          # bytes; this tests what GitHub serves.
          for attempt in 1 2 3 4 5 6; do
            FEED="$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/appcast.xml?$(date +%s)" || true)"
            printf '%s' "$FEED" | grep -q "VibeRes-${VERSION}.zip" && break
            echo "feed not updated yet (attempt $attempt); raw.githubusercontent caches briefly"
            sleep 10
          done
          printf '%s' "$FEED" | grep -q "VibeRes-${VERSION}.zip" \
            || { echo "::error::published feed does not reference ${VERSION}"; exit 1; }

          SIG="$(printf '%s' "$FEED" | python3 -c "import re,sys; print(re.search(r'sparkle:edSignature=\"([^\"]+)\"', sys.stdin.read()).group(1))")"
          LEN="$(printf '%s' "$FEED" | python3 -c "import re,sys; print(re.search(r'length=\"(\d+)\"', sys.stdin.read()).group(1))")"

          curl -fsSL -o "$RUNNER_TEMP/public.zip" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/VibeRes-${VERSION}.zip"
          ACTUAL="$(stat -f%z "$RUNNER_TEMP/public.zip")"
          [ "$ACTUAL" = "$LEN" ] || { echo "::error::feed says $LEN bytes, asset is $ACTUAL"; exit 1; }

          # The earlier step deleted its key file; a user's copy verifies with
          # the embedded public key, which is derived from this same seed —
          # cryptographically the identical check.
          KEY="$RUNNER_TEMP/sparkle_ed25519_smoke.key"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"
          SIGN_UPDATE="$(find ./build/SourcePackages/artifacts -name sign_update -type f -perm +111 | head -1)"
          "$SIGN_UPDATE" --ed-key-file "$KEY" --verify "$RUNNER_TEMP/public.zip" "$SIG" \
            || { rm -f "$KEY"; echo "::error::the public feed does not verify against the public asset"; exit 1; }
          rm -f "$KEY"
          echo "public feed and public asset agree"

      # Runs even on failure so a broken build never leaves the private key or
      # the API key sitting on the runner for the rest of the job.
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/sparkle_ed25519.key"
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      # Notes go to a file, never through $GITHUB_OUTPUT into a shell argument.
      # CHANGELOG text is arbitrary markdown: a backtick or a `$(` in a release
      # entry would be evaluated by the shell in the step that consumes it.

  sync-tap:
    name: Sync formula and cask to tap
    needs: release
    runs-on: macos-26
    timeout-minutes: 5
    # Don't fail the whole pipeline if the user hasn't set up the PAT yet —
    # release itself already published. Tap can be synced manually.
    continue-on-error: true

    steps:
      - name: Checkout tap repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: m-moravcik/homebrew-viberes
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: tap

      - name: Update formula
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          # Replace `tag: "vOLD"` and `version "OLD"` lines.
          sed -E -i '' \
            -e "s|tag: \"v[0-9]+\.[0-9]+\.[0-9]+\"|tag: \"v${VERSION}\"|" \
            -e "s|version \"[0-9]+\.[0-9]+\.[0-9]+\"|version \"${VERSION}\"|" \
            tap/Formula/viberes.rb

      - name: Update cask version + sha256
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          SHA="${{ needs.release.outputs.sha256 }}"
          sed -E -i '' \
            -e "s|version \"[0-9]+\.[0-9]+\.[0-9]+\"|version \"${VERSION}\"|" \
            -e "s|sha256 \"[a-f0-9]{64}\"|sha256 \"${SHA}\"|" \
            tap/Casks/viberes-app.rb

      - name: Commit and push
        working-directory: tap
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to tap (already in sync)."
            exit 0
          fi
          git commit -m "viberes ${VERSION}: formula + cask"
          git push
